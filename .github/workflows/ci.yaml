name: "CI"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:

  lint:
    name: "Lint"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test:
    name: "Test"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # the tests validate against the reference C implementation (liblzo2)
      - name: Install liblzo2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblzo2-dev

      - name: Vet
        run: |
          go vet ./...
          go vet -tags liblzo2 ./...

      - name: Test
        run: go test -race -tags liblzo2 ./...

      - name: Fuzz against liblzo2
        run: go test -tags liblzo2 -run '^$' -fuzz '^FuzzLiblzo2Differential$' -fuzztime 30s .
